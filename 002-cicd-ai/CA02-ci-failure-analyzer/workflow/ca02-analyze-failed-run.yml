# Copy to .github/workflows/ in your repository.
#
# Before you use it:
#   1. Copy this project (src/ and requirements.txt) into your repository
#      and set ANALYZER_DIR below to that folder.
#   2. Change `workflows: ["CI"]` to the name of the workflow to watch.
#   3. Add the repository secret ANTHROPIC_API_KEY.
#
# GitHub only starts a workflow_run workflow from the default branch, so
# merge this file there before testing it.
#
# It runs after the watched workflow finishes. If that run failed, the
# analyzer reads the failed-step logs and writes its report to the job summary.
name: Analyze failed CI run

on:
  workflow_run:
    workflows: ["CI"]            # <- the name of the workflow to watch
    types: [completed]

permissions:
  actions: read                  # lets `gh run view --log-failed` read the logs
  contents: read

env:
  ANALYZER_DIR: tools/ci-analyzer   # <- where you copied src/ and requirements.txt

jobs:
  analyze:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # No pull request code is checked out: this is the default branch,
      # which holds the analyzer.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ${{ env.ANALYZER_DIR }}
        run: pip install -r requirements.txt
      - name: Analyze the failed run
        working-directory: ${{ env.ANALYZER_DIR }}
        shell: bash                # bash with pipefail: a failed analyzer fails the step
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          python -m src.cli --gh-run "$RUN_ID" --repo "$REPO" | tee analysis.md >> "$GITHUB_STEP_SUMMARY"
